server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
